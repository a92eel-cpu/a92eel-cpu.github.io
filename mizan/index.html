@font-face{font-family:'IBM Plex Sans Arabic';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/plex-arabic-400.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFC}

@font-face{font-family:'IBM Plex Sans Arabic';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/plex-latin-500.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  color-scheme:light dark;
  --bg:light-dark(#ffffff,#07130d);
  --card:light-dark(#f3f5f4,#0f2118);
  --card2:light-dark(#e6ebe8,#17301f);
  --sheet:light-dark(#ffffff,#0b1a12);
  --line:light-dark(#e3e7e5,#1d3428);
  --ink:light-dark(#0b0b10,#eef6f1);
  --ink2:light-dark(#5b635f,#a3b8ad);
  --ink3:light-dark(#8b938f,#6c8276);
  --brand:#00a862;
  --brand-ink:light-dark(#007a46,#43d695);
  --mist:light-dark(#eafaf2,#0f2d1d);
  --hero:light-dark(#00a862,#0a6b41);
  --hero-over:light-dark(#c8363b,#8f2328);
  --red:light-dark(#cf353a,#ff7a7e);
  --red-bg:light-dark(#fdeeee,#3b1618);
  --amber:light-dark(#a35f00,#f5b84d);
  --amber-bg:light-dark(#fff3dc,#33260c);
  --hero2:light-dark(#007a46,#064d2f);
  --hero-over2:light-dark(#9b1c22,#5e1519);
  --glow:rgb(0 168 98/.5);
  --heat:#f97316;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --spring:linear(0,0.006,0.025 2.8%,0.101 6.1%,0.539 18.9%,0.721 25.3%,0.849 31.5%,0.937 38.1%,0.968 41.8%,0.991 45.7%,1.006 50.1%,1.015 55%,1.017 63.9%,1.001 85.9%,1);
  --pop:linear(0,0.009,0.035 2.1%,0.141,0.281 6.7%,0.723 12.9%,0.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,0.991,0.977 51%,0.974 53.8%,0.975 57.1%,0.997 69.8%,1.003 76.9%,1.004 83.8%,1);
  --swing:linear(0,0.12 4%,0.5 10%,0.92 17%,1.13 23%,1.19 27%,1.13 32%,0.98 40%,0.92 46%,0.95 52%,1.02 60%,1.03 66%,1 76%,0.995 86%,1);
  --font:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --top:env(safe-area-inset-top,0px);
  --bot:env(safe-area-inset-bottom,0px);
}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
:root[data-accent=blue]{--brand:#2563eb;--brand-ink:light-dark(#1d4ed8,#8fb0ff);--mist:light-dark(#eaf1ff,#0f1d3d);--hero:light-dark(#2563eb,#1d3f9a);--hero2:light-dark(#1e3a8a,#13275e);--glow:rgb(37 99 235/.5)}
:root[data-accent=violet]{--brand:#7c3aed;--brand-ink:light-dark(#6d28d9,#bba3ff);--mist:light-dark(#f3edff,#1f1538);--hero:light-dark(#7c3aed,#5b21b6);--hero2:light-dark(#4c1d95,#33136b);--glow:rgb(124 58 237/.5)}
:root[data-accent=rose]{--brand:#e11d48;--brand-ink:light-dark(#be123c,#ff94aa);--mist:light-dark(#ffeef2,#3a1220);--hero:light-dark(#e11d48,#9f1239);--hero2:light-dark(#881337,#5c0b24);--glow:rgb(225 29 72/.5)}
:root[data-accent=amber]{--brand:#d97706;--brand-ink:light-dark(#b45309,#fbbf63);--mist:light-dark(#fff5e6,#33220a);--hero:light-dark(#d97706,#92400e);--hero2:light-dark(#92400e,#5f2a08);--glow:rgb(217 119 6/.5)}
:root[data-accent=teal]{--brand:#0d9488;--brand-ink:light-dark(#0f766e,#5eead4);--mist:light-dark(#e6fbf8,#0b2b28);--hero:light-dark(#0d9488,#115e59);--hero2:light-dark(#115e59,#0a3d3a);--glow:rgb(13 148 136/.5)}
:root[data-accent=ink]{--brand:#334155;--brand-ink:light-dark(#1e293b,#cbd5e1);--mist:light-dark(#eef2f6,#1a2230);--hero:light-dark(#334155,#1e293b);--hero2:light-dark(#0f172a,#0b1220);--glow:rgb(30 41 59/.5)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--font);overflow-x:clip;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3,p{margin:0;font-weight:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.35;cursor:default}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ic{flex:none;display:block}
.ii{display:inline-flex;vertical-align:-3px;margin-inline-end:4px}
.flip{transform:scaleX(-1)}
bdi.m{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;unicode-bidi:isolate;white-space:nowrap}
.cur{font-size:max(11px,.72em);font-weight:500;opacity:.78;margin-inline-start:.28em;white-space:nowrap}
.grow{flex:1}

#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
.view{padding:calc(var(--top) + 14px) 16px calc(96px + var(--bot))}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-height:44px}
.hd-act{display:flex;gap:8px}
.t-title{font-size:21px;font-weight:700;line-height:1.45}
.t-hero{font-size:clamp(28px,8.4vw,34px);font-weight:700;line-height:1.3;margin-top:2px}
.t-sec{font-size:15.5px;font-weight:700;line-height:1.5}
.small{font-size:12.5px;color:var(--ink2);line-height:1.65}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);flex:none}
.ibtn.sm{width:36px;height:36px}
.ibtn.pri{background:var(--brand);color:#fff}
.syncb{color:var(--ink2)}
.syncb.err{color:var(--amber)}
.syncb.spin .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lnk{color:var(--brand-ink);font-weight:600;font-size:14px;min-height:40px;padding:0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:0 16px;border-radius:14px;font-weight:600;font-size:14.5px;background:var(--card);text-align:center;line-height:1.45}
.btn.pri{background:var(--brand);color:#fff}
.btn.dng{background:var(--red-bg);color:var(--red)}
.btn.block{width:100%}
.btns{display:flex;gap:9px;margin-top:14px}
.btns>.btn{flex:1}
.btns>.btn.dng{flex:0 0 auto}
.btns.sm .btn{min-height:40px;font-size:13.5px;padding:0 10px}
.card{background:var(--card);border-radius:18px;padding:14px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 6px}
.cyc{display:flex;align-items:center;gap:7px;margin:-2px 2px 12px;flex-wrap:wrap}
.dot{width:4px;height:4px;border-radius:50%;background:var(--ink3)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:15px;background:var(--amber-bg);color:var(--amber);font-size:12.5px;line-height:1.65;margin-bottom:12px}
.banner.ok{background:var(--mist);color:var(--brand-ink)}
.banner .grow b{font-weight:700}

.hero{position:relative;overflow:hidden;background:linear-gradient(145deg,var(--hero) 0%,var(--hero2) 100%);color:#fff;border-radius:26px;padding:18px 18px 16px;isolation:isolate;box-shadow:0 22px 44px -26px var(--glow),inset 0 1px 0 rgb(255 255 255/.18)}
.hero.over{background:linear-gradient(145deg,var(--hero-over) 0%,var(--hero-over2) 100%);box-shadow:0 22px 44px -24px rgb(200 54 59/.55),inset 0 1px 0 rgb(255 255 255/.18)}
.hero.over .hfoot .ic{animation:wig 1.6s ease-in-out infinite}
.hero::before{content:'';position:absolute;z-index:-1;top:-55%;inset-inline-start:-25%;width:95%;aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,rgb(255 255 255/.24),rgb(255 255 255/0));animation:orbA 13s ease-in-out infinite alternate;pointer-events:none}
.hero::after{content:'';position:absolute;z-index:-1;inset:0;background:linear-gradient(110deg,transparent 30%,rgb(255 255 255/.16) 46%,rgb(255 255 255/.05) 54%,transparent 68%);transform:translateX(110%);animation:shine 7.5s cubic-bezier(.45,0,.25,1) 1.4s infinite;pointer-events:none}
.hero .orb{position:absolute;z-index:-1;bottom:-62%;inset-inline-end:-30%;width:90%;aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,rgb(255 255 255/.14),transparent);animation:orbB 16s ease-in-out infinite alternate;pointer-events:none}
@keyframes orbA{to{transform:translate(18%,22%) scale(1.25)}}
@keyframes orbB{to{transform:translate(-20%,-18%) scale(1.15)}}
@keyframes shine{0%{transform:translateX(110%)}24%,100%{transform:translateX(-110%)}}
@keyframes wig{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}}
.hscale{position:absolute;inset-inline-end:4px;top:12px;width:126px;height:auto;z-index:-1;opacity:.42;overflow:visible;pointer-events:none}
.hscale .sb-beam,.hscale .sb-l,.hscale .sb-r{transform-box:view-box;transition:transform 1.9s var(--swing)}
.hscale .sb-beam{transform-origin:60px 18px}
.hscale .sb-sway{transform-box:view-box;transform-origin:60px 10px;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.hl{font-size:12.5px;opacity:.9;line-height:1.65}
.meter{height:9px;border-radius:99px;background:rgb(255 255 255/.22);overflow:hidden;margin:12px 0 7px}
.meter>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,rgb(255 255 255/.86),#fff);position:relative;overflow:hidden;box-shadow:0 0 12px rgb(255 255 255/.45)}
.meter>i::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(-45deg,transparent 0 6px,rgb(0 0 0/.07) 6px 12px);background-size:17px 17px;animation:stripes 1.1s linear infinite}
@keyframes stripes{to{background-position:17px 0}}
.hrow{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;line-height:1.65}
.hfoot{display:flex;gap:9px;margin-top:12px;padding-top:11px;border-top:1px solid rgb(255 255 255/.22);align-items:center;font-size:14px;line-height:1.55}
.hset{display:inline-flex;align-items:center;gap:7px;margin-top:12px;min-height:38px;padding:0 13px;border-radius:99px;background:rgb(255 255 255/.18);font-size:12.5px;font-weight:600;line-height:1.5}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:var(--card);border-radius:16px;padding:11px;display:flex;flex-direction:column;gap:3px}
.tic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;margin-bottom:2px}
.tic.in{background:var(--mist);color:var(--brand-ink)}
.tic.out{background:var(--red-bg);color:var(--red)}
.tic.sv{background:var(--amber-bg);color:var(--amber)}
.tic.bal{background:var(--card2);color:var(--ink)}
.tv{font-weight:700;font-size:14px;line-height:1.45;overflow-wrap:anywhere}

.ask{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:16px;padding:4px;margin-top:12px;border:1.5px solid transparent;transition:border-color .2s}
.ask:focus-within{border-color:var(--brand);background:var(--bg)}
.ask input{flex:1;border:0;background:none;min-height:44px;padding:0 11px;outline:none}
.ask .go,.ask .mic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none}
.ask .go{background:var(--brand);color:#fff}
.ask .mic{color:var(--ink2)}
.ask .mic.on{color:#fff;background:var(--red);box-shadow:0 0 0 0 rgb(207 53 58/.5);animation:micRing 1.3s ease-out infinite}
@keyframes micRing{to{box-shadow:0 0 0 12px rgb(207 53 58/0)}}
.wave{display:flex;gap:3px;align-items:center;height:20px}
.wave i{width:3px;height:6px;border-radius:2px;background:#fff;animation:wv .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}
@keyframes wv{0%,100%{height:5px}50%{height:19px}}
.ask:focus-within{box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 14%,transparent)}
@keyframes pulse{50%{opacity:.6}}
.hint{display:flex;align-items:center;gap:6px;margin:7px 8px 0;font-size:12.5px;color:var(--ink2);line-height:1.6}

.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:0;padding-inline:6px 13px;border-radius:99px;background:var(--card);font-weight:500;font-size:14px;white-space:nowrap;line-height:1.4}
.chip.add{padding-inline:13px;color:var(--brand-ink);gap:5px}
.chip .small{font-weight:400}
.cdot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}

.wcards{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.wcards::-webkit-scrollbar{display:none}
.wcard{flex:none;min-width:150px;min-height:94px;padding:12px 13px;border-radius:19px;background:linear-gradient(140deg,color-mix(in srgb,var(--wc,#00a862) 86%,#fff),color-mix(in srgb,var(--wc,#00a862) 76%,#000));color:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:8px;line-height:1.5;position:relative;overflow:hidden;isolation:isolate;box-shadow:0 14px 24px -18px var(--wc,#00a862),inset 0 1px 0 rgb(255 255 255/.22)}
.wcard::before{content:'';position:absolute;z-index:-1;width:120px;height:120px;border-radius:50%;inset-inline-start:-40px;bottom:-62px;background:rgb(255 255 255/.12)}
.wcard::after{content:'';position:absolute;z-index:-1;width:74px;height:74px;border-radius:50%;inset-inline-end:-24px;top:-34px;background:rgb(255 255 255/.1)}
.wcard .wn{display:flex;align-items:center;gap:6px;font-size:12.5px;color:rgb(255 255 255/.92);font-weight:500}
.wcard b{font-size:15.5px;font-weight:700}
.wcard .cur{opacity:.85}
.wcard.add{align-items:center;justify-content:center;color:var(--brand-ink);font-weight:600;font-size:13.5px;min-width:96px}

.list{background:var(--card);border-radius:16px;padding:0 13px}
.dayh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2);margin:14px 6px 5px;line-height:1.6}
.tx{display:flex;align-items:center;gap:11px;width:100%;padding:10px 0;min-height:60px}
.txw{position:relative;overflow:hidden}
.txw+.txw{border-top:1px solid var(--line)}
.txbg{position:absolute;inset:4px 0;border-radius:13px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--red);color:#fff;opacity:0;transition:opacity .15s}
.txw.sw-on .txbg{opacity:1}
.txw.arm .txbg .ic{animation:popIn .35s var(--pop)}
.txw .tx{position:relative;background:var(--card);transition:transform .5s var(--spring)}
.txw .tx.dragging{transition:none}
.txw.gone{transition:height .3s var(--ease-out),opacity .25s;opacity:0}
.txw.flash .tx{animation:flash 1.8s var(--ease-out)}
@keyframes flash{0%{background:color-mix(in srgb,var(--brand) 26%,var(--card));transform:translateX(-18px)}22%{transform:none}100%{background:var(--card)}}
.cico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.tx .mid{flex:1;display:flex;flex-direction:column;line-height:1.5}
.ttl{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.sub{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600;white-space:nowrap;flex:none}
.amt.in{color:var(--brand-ink)}
.amt.tr{color:var(--ink2)}
.amt.late{color:var(--red)}
.empty{text-align:center;padding:22px 16px 8px;display:flex;flex-direction:column;align-items:center;gap:7px}
.empty>svg{width:132px;height:auto;margin-bottom:4px}
.empty h3{font-size:15.5px;font-weight:700;line-height:1.5}
.empty .btn{margin-top:6px}

.tabs{position:fixed;inset-inline:0;bottom:0;z-index:20;margin:0 auto;max-width:560px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;padding:5px 6px calc(5px + var(--bot));background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-top:1px solid var(--line)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:48px;color:var(--ink3);font-size:11.5px;font-weight:500;line-height:1.4;text-align:center;transition:color .3s}
.tab.on{color:var(--brand-ink);font-weight:600}

/* ===== motion system ===== */
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
@keyframes sideIn{from{opacity:0;transform:translateX(-24px)}}
@keyframes popIn{from{opacity:0;transform:scale(.55)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes floaty{50%{transform:translateY(-6px)}}
@keyframes blink{50%{opacity:.25;transform:scale(.7)}}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.12,1.2) rotate(4deg)}}
.enter>*{animation:rise .62s var(--ease-out) both;animation-delay:calc(var(--i,0)*42ms + 30ms)}
.enter .chips>*,.enter .wcards>*{animation:sideIn .6s var(--ease-out) both;animation-delay:calc(var(--j,0)*45ms + 230ms)}
.enter .list>*,.enter .grp>*,.enter .sugg>*{animation:rise .5s var(--ease-out) both;animation-delay:calc(var(--j,0)*34ms + 170ms)}
.enter .tiles>*{animation:rise .55s var(--ease-out) both;animation-delay:calc(var(--j,0)*60ms + 150ms)}
.enter .tiles .tic,.enter .qa .qai{animation:popIn .7s var(--pop) both;animation-delay:calc(var(--j,0)*60ms + 330ms)}
.enter .qa>*{animation:rise .5s var(--ease-out) both;animation-delay:calc(var(--j,0)*55ms + 200ms)}
.enter .bdg>*{animation:popIn .55s var(--pop) both;animation-delay:calc(var(--j,0)*35ms + 150ms)}
.enter .cal>button{animation:popIn .45s var(--pop) both;animation-delay:calc(var(--j,0)*11ms + 260ms)}
.enter .trend .tb i,.enter .bars i{transform-origin:bottom}
.btn,.chip,.ibtn,.wchip,.seg button,.lnk,.dayg button,.qa button,.bd,.thc,.acg button,.cal button,.scard{transition:transform .28s var(--pop),background-color .25s,color .25s,box-shadow .25s,opacity .2s}
.btn:active,.chip:active,.ibtn:active,.wchip:active,.dayg button:active,.cal button:active,.bd:active,.thc:active,.scard:active,.wcard:active{transform:scale(.95)}
.wcard{transition:transform .3s var(--pop)}
.tile,.row,.lrow,.upc,.crow{transition:transform .25s var(--pop),background-color .2s}
.tile:active,.row:active,.lrow:active,.upc:active,.txw .tx:active{transform:scale(.985)}
.seg button{transition:background-color .3s,color .3s,box-shadow .3s,transform .25s var(--pop)}
.enter .seg button.on{animation:segOn .45s var(--pop)}
@keyframes segOn{from{transform:scale(.92)}}
.seg.s5 button{font-size:12.5px;padding:0 2px}
.seg.s6{grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr))}
.pill.bad{background:light-dark(#fdeaea,#3a1416);color:var(--red)}
.pill.mute{background:var(--card2);color:var(--ink2)}

/* view transitions */

::view-transition-old(page){animation:.22s ease-in both vtOut0}
::view-transition-new(page){animation:.48s var(--ease-out) both vtIn0}

html.vt-f::view-transition-new(page){animation-name:vtInF}

html.vt-b::view-transition-new(page){animation-name:vtInB}

@keyframes vtInB{from{opacity:0;transform:translateX(34px)}}
@keyframes vtOutB{to{opacity:0;transform:translateX(-26px)}}

/* ---------- smart entry parser ---------- */
function prep(s){return String(s).replace(/[\u064B-\u0652\u0640]/g,'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٬/g,',').replace(/٫/g,'.').replace(/([$€₺])/g,' $1 ').replace(/(\d)([^\d\s.,])/g,'$1 $2').replace(/([^\d\s.,])(\d)/g,'$1 $2').replace(/\s+/g,' ').trim();}
function numTok(w){

const tokVal=(w,first)=>numTok(w)||(first&&w.length>1&&w[0]==='ب'?numTok(w.slice(1)):null);

    while(j<nt.length){

      if(!v&&j>i&&w.length>1&&w[0]==='و'){v=numTok(w.slice(1));conj=!!v;}
      if(!v&&j>i&&w==='و'){const nx=nt[j+1]||'';if(numTok(nx)||(nx[0]==='و'&&numTok(nx.slice(1)))){used.add(j);joined=true;j++;continue;}break;}

      else if(v.k==='s2'){total+=cur+v.v;cur=0;last=v.v/2;scaled=true;core=true;}

}

  for(const k of tk)if(OB.tx[k]===snapT[k])delete OB.tx[k];

async function pull(){
  const since=S.last?new Date((Date.parse(String(S.last).replace(/(\.\d{3})\d+/,'$1'))||0)-5000).toISOString():'1970-01-01T00:00:00Z';
  let maxU=S.last,changed=false;
  for(const table of ['store','tx']){
    for(let from=0;;from+=1000){
      const {data,error}=await sb.from(table).select('*').gt('updated_at',since).order('updated_at',{ascending:true}).range(from,from+999);
      if(error)throw error;
      for(const r of data||[]){
        if(!maxU||String(r.updated_at)>String(maxU))maxU=r.updated_at;
        if(table==='tx'){if(OB.tx[r.id])continue;S.tx[r.id]=fromRow(r);changed=true;}
        else{if(OB.st[r.coll+'|'+r.id])continue;applyStoreRow(r);changed=true;}
      }

    }
  }

}

}

/* ---------- dialogs & toast ---------- */
function dialog({title,msg='',ok='تأكيد',cancel='إلغاء',danger=false,confirmText=''}){
  return new Promise(res=>{
    const d=document.createElement('div');d.className='dlg';d.setAttribute('role','alertdialog');d.setAttribute('aria-modal','true');
    d.innerHTML=`<div><h3>${esc(title)}</h3>${msg?`<p>${esc(msg)}</p>`:''}${confirmText?`<input class="inp" id="dlgIn" style="margin-top:12px" placeholder="اكتب «${esc(confirmText)}» للتأكيد" autocomplete="off">`:''}<div class="btns"><button class="btn" data-x="0">${esc(cancel)}</button><button class="btn ${danger?'dng':'pri'}" data-x="1">${esc(ok)}</button></div></div>`;
    document.body.appendChild(d);const done=v=>{d.remove();res(v);};
    d.addEventListener('click',e=>{e.stopPropagation();const b=e.target.closest('[data-x]');if(b){if(b.dataset.x==='1'&&confirmText){const i=$('#dlgIn',d);if(i.value.trim()!==confirmText){shakeEl(i);i.focus();return;}}done(b.dataset.x==='1');}else if(e.target===d)done(false);});
    setTimeout(()=>{const f=confirmText?$('#dlgIn',d):d.querySelector('[data-x="1"]');if(f)f.focus();},60);
  });
}
let toastT=null,toastFn=null;
function toast(msg,act,kind){const el=$('#toast');kind=kind||(act?'undo':/^(انحفظ|انضاف|انسجل|تم|تفعّل|مبروك|تسدد|أهلاً|تغيّر|الشهر المالي صار|العملة الأساسية صارت|وصلت للهدف|سجّلت|انشال|انحذف)/.test(msg)?'ok':/^(اكتب|اختار|لازم|ما |تعذّر|حدد|الملف|ماكو|تجاوزت|محاولات|هذا الإيميل|انتهت)/.test(msg)?'warn':'info');
  const icn=kind==='ok'?ic('check',16,3):kind==='undo'?ic('rotate-ccw',15,2.4):kind==='warn'?ic('circle-alert',16,2.4):ic('info',16,2.2);
  el.classList.remove('show');void el.offsetWidth;el.innerHTML=`<span class="tic ${kind}">${icn}</span><span>${esc(msg)}</span>${act?`<button data-act="toastAct">${esc(act.l)}</button><i class="tbar"></i>`:''}`;toastFn=act?act.fn:null;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>{el.classList.remove('show');toastFn=null;},act?5000:2800);}
function shakeEl(el){if(!el)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}

/* ---------- lock (PIN + Face ID) ---------- */
async function hashPin(p){const s='mizan|'+p;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return 'f'+(h>>>0).toString(16);}}
const b64u={enc:b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),dec:s=>{s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0)).buffer;}};
async function bioSetup(){try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'ميزان'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'mizan',displayName:'ميزان'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}});if(!c)return false;lsSet(K('bio'),b64u.enc(c.rawId));return true;}catch(e){console.warn(e);return false;}}
async function bioCheck(){const id=lsGet(K('bio'));if(!id)return false;try{const a=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:b64u.dec(id),transports:['internal']}],userVerification:'required',timeout:60000}});return !!a;}catch(e){console.warn(e);return false;}}
const lockOn=()=>!!(S.set.pin||lsGet(K('bio')));

/* ---------- Ask Claude (deep link into the Claude app) ---------- */
function aiSummary(){
  const st=S.set,cur=st.cur,cy=cycle(0),s=stats(cy),pc=cycle(-1),ps=stats(pc);
  const f=v=>Math.round(+v||0).toLocaleString('en-US'),cn=(k,t)=>catById(k,t).n,L=[];
  L.push(`اليوم ${ymd(today())}. العملة الأساسية ${CURS[cur].n}${st.curs.filter(c=>c!==cur&&rate(c)).map(c=>`، 1 ${CURS[c].s} = ${f(toMain(1,c))} ${CURS[cur].s}`).join('')}.`);
  L.push(`الشهر المالي يبدأ يوم ${st.start}. الدورة الحالية ${cy.s} إلى ${cy.e} (باقي ${cy.left} يوم).`);
  L.push(`الميزانية: ${+st.budget?f(st.budget):'غير محددة'}. مصاريف الدورة ${f(s.exp)}، دخلها ${f(s.inc)}، الرصيد ${f(balanceNow(s))}.`);
  L.push('مصاريف الدورة حسب الفئة: '+(Object.entries(s.byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${cn(k,'e')} ${f(v)}${st.cb&&+st.cb[k]?` (ميزانيتها ${f(st.cb[k])})`:''}`).join('، ')||'لا شيء'));
  L.push(`الدورة السابقة: مصاريف ${f(ps.exp)}، دخل ${f(ps.inc)}. `+(Object.entries(ps.byCat).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>`${cn(k,'e')} ${f(v)}`).join('، ')));
  const wb=walletBal();L.push('المحافظ: '+wallets().map(w=>`${w.n} ${f(wb[w.id])} ${CURS[w.c]?CURS[w.c].s:w.c}`).join('، '));

  window.addEventListener('resize',()=>moveTind());
  try{RM.addEventListener('change',()=>{_thm='';applyTheme();});}catch(e){}
  document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();if(F[f.dataset.form])F[f.dataset.form](f);});
  document.addEventListener('input',e=>{const t=e.target;
    if(!e.isComposing&&(t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&!/^(password|email|checkbox|radio|date|month|file|range)$/.test(t.type))))normInput(t,e.inputType);
    if(t.dataset&&t.dataset.st&&t.type!=='checkbox'){const s=top();if(s){setPath(s.st,t.dataset.st,t.value);if(t.id==='taIn')s.st.taE=!!t.value.trim();}}
    if(t.id==='cvA'){const s=top();if(s&&s.kind==='conv')cvUpdate(s);}if(t.id==='askIn')UI.askText=t.value;else if(t.id==='aiIn')UI.aiText=t.value;else if(t.id==='txQ'){UI.q=t.value;UI.more=1;const L=$('#txList');if(L)L.innerHTML=txListHtml();}});
  document.addEventListener('change',async e=>{const t=e.target;
    if(t.dataset&&t.dataset.set)saveSettings({[t.dataset.set]:t.checked});
    if(t.dataset&&t.dataset.st&&t.type==='checkbox'){const s=top();if(s){setPath(s.st,t.dataset.st,t.checked);if(t.dataset.repaint)paint(s);}}
    if(t.dataset&&t.dataset.st&&t.tagName==='SELECT'){const s=top();if(s&&s.kind==='jam'&&t.dataset.st==='m')paint(s);}
    if(t.id==='bioT'){if(t.checked){const ok=await bioSetup();if(!ok){t.checked=false;toast('ما تفعّل Face ID');}else{UI.unlocked=true;toast('تفعّل القفل بـ Face ID');}}else{lsSet(K('bio'),null);toast('توقف Face ID');}}});
  document.addEventListener('focusout',e=>{const t=e.target;if(t.dataset&&t.dataset.num&&t.value.trim()){const n=parseNum(t.value);t.value=n?fmtIn(n):'';const s=top();if(s&&t.dataset.st)setPath(s.st,t.dataset.st,t.value);if(s&&s.kind==='jam'&&t.dataset.st==='m')paint(s);}});
  document.addEventListener('keydown',e=>{
    const t=e.target;
    if(STY){if(e.key==='Escape')closeStory();else if(e.key==='ArrowLeft')storyGo(STY.i+1);else if(e.key==='ArrowRight')storyGo(STY.i-1);return;}
    if(!$('#lock').hidden){if(/^\d$/.test(e.key))A.lk({dataset:{v:e.key}});else if(e.key==='Backspace')A.lk({dataset:{v:'del'}});return;}
    if(document.querySelector('.dlg'))return;
    const s=top();
    if(s&&s.kind==='tx'&&!/INPUT|TEXTAREA|SELECT/.test(t.tagName)){if(/^\d$/.test(e.key))A.kp({dataset:{v:e.key}});else if(e.key==='Backspace')A.kp({dataset:{v:'del'}});else if(e.key==='.')A.kp({dataset:{v:'.'}});else if(e.key==='Enter'){e.preventDefault();A.txSave();}}
    if(e.key==='Escape'&&s&&!s.opt.lock)closeSheet();
  });
  let lastDay=ymd(today());
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){UI.hiddenAt=Date.now();return;}
    if(S.uid&&lockOn()&&UI.unlocked&&UI.hiddenAt&&Date.now()-UI.hiddenAt>60000)showLock();
    const d=ymd(today());if(d!==lastDay&&S.ready){lastDay=d;render();if(S.recDone)genRecurring();}
    if(S.uid)syncNow();
  });
  window.addEventListener('online',()=>{if(S.uid)syncNow();});
  window.addEventListener('offline',()=>{S.sync='offline';paintSync();});
  setInterval(()=>{if(S.uid&&!document.hidden)syncNow();},60000);
  $('#fileIn').addEventListener('change',onRestoreFile);
}
async function boot(){
  bind();applyFont();applyTheme();
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){try{navigator.serviceWorker.register('sw.js');}catch(e){}}
  if(!window.supabase||!window.supabase.createClient){$('#view').innerHTML=`<div class="auth"><div class="brand">${LOGO(64)}<h1>ميزان</h1><p class="small">ما گدرت أحمّل التطبيق، تأكد من الإنترنت وافتحه مرة ثانية.</p></div></div>`;return;}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'mz.auth'}});
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='PASSWORD_RECOVERY'){setTimeout(()=>openSheet('newpass',{},{lock:true}),300);}
    if((ev==='SIGNED_IN'||ev==='INITIAL_SESSION'||ev==='TOKEN_REFRESHED')&&session&&!S.uid)setTimeout(()=>startUser(session),0);
    if(ev==='SIGNED_OUT'&&S.uid)signedOut(false);
  });
  render();
  let session=null;
  try{const {data}=await sb.auth.getSession();session=data&&data.session;}catch(e){}
  if(session)await startUser(session);
  else{
    const raw=lsGet('mz.auth');let u=null;try{u=raw&&JSON.parse(raw);u=u&&(u.user||(u.currentSession&&u.currentSession.user));}catch(e){}
    if(u&&u.id&&navigator.onLine===false){S.uid=u.id;S.email=u.email||'';loadCache();S.ready=true;S.sync='offline';if(lockOn())showLock();render();}
    else render();
  }
}
boot();
}
</script>
